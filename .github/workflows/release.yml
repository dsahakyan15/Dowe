name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tag, manifest, and JavaScript
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${manifest_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} must match manifest version v${manifest_version}."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build extension ZIP
        shell: bash
        run: |
          archive="dowe-${GITHUB_REF_NAME}.zip"
          mkdir -p dist/package
          cp -R manifest.json src icons dist/package/
          cd dist/package
          zip -qr "../${archive}" .
          cd ..
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dowe-${{ github.ref_name }}
          path: |
            dist/dowe-${{ github.ref_name }}.zip
            dist/dowe-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/dowe-${GITHUB_REF_NAME}.zip"
          "dist/dowe-${GITHUB_REF_NAME}.zip.sha256"
          --verify-tag
          --generate-notes
          --title "Dowe ${GITHUB_REF_NAME}"
